<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Computer Use: Autonomous Desktop Agent Execution</title>
  <defs>
    <!-- Analog dip-pen tremor; the seed steps so the ink "boils" -->
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <feTurbulence type="fractalNoise" baseFrequency="0.013" numOctaves="2" seed="7" result="noise">
        <animate attributeName="seed" values="7;11;3;14;5;9" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <style>
    /* one 6s loop: text types in, cursor glides over, hand lifts, click, ripples, settle, reset */

    .line    { stroke-dasharray: 1 1.1; animation: type 6s ease-in-out infinite backwards; animation-delay: var(--d, 0s); }
    .halo    { transform-box: fill-box; transform-origin: center; animation: glow 3s ease-in-out infinite; }
    .halo2   { animation-delay: 0.4s; }
    .rays    { transform-box: fill-box; transform-origin: center; animation: rays 6s ease-out infinite; }
    .dot     { transform-box: fill-box; transform-origin: center; animation: dot 6s ease-out infinite; }

    .ripple  { transform-box: fill-box; transform-origin: center; opacity: 0; animation: ripple 6s ease-out infinite; }
    .ripple2 { animation-delay: 0.22s; }

    .cursor  { transform-box: view-box; transform-origin: 914px 354px; animation: glide 6s ease-in-out infinite; }
    .hand    { animation: tap 6s ease-in-out infinite; }

    @keyframes type {
      0%   { stroke-dashoffset: 1.1; opacity: 1; }
      14%  { stroke-dashoffset: 0; }
      90%  { stroke-dashoffset: 0; opacity: 1; }
      97%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1.1; opacity: 0; }
    }
    @keyframes glow   { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.6; } }
    @keyframes rays {
      0%, 44% { transform: scale(1); opacity: 1; }
      48%     { transform: scale(1.35); opacity: 1; }
      60%     { transform: scale(1.05); opacity: 0.7; }
      100%    { transform: scale(1); opacity: 1; }
    }
    @keyframes dot {
      0%, 44% { transform: scale(1); }
      48%     { transform: scale(1.4); }
      58%     { transform: scale(1); }
      100%    { transform: scale(1); }
    }
    @keyframes ripple {
      0%, 45% { transform: scale(0.5); opacity: 0; }
      47%     { transform: scale(0.8); opacity: 1; }
      66%     { transform: scale(2.3); opacity: 0; }
      100%    { transform: scale(2.3); opacity: 0; }
    }
    @keyframes glide {
      0%   { transform: translate(-340px, 230px) scale(1); opacity: 0; }
      8%   { opacity: 1; }
      42%  { transform: translate(0, 0) scale(1); }
      46%  { transform: translate(0, 0) scale(0.84); }
      51%  { transform: translate(0, 0) scale(1); }
      88%  { transform: translate(0, 0) scale(1); opacity: 1; }
      96%  { transform: translate(0, 0) scale(1); opacity: 0; }
      100% { transform: translate(-340px, 230px) scale(1); opacity: 0; }
    }
    @keyframes tap {
      0%, 38% { transform: translateY(0); }
      43%     { transform: translateY(-9px); }
      46%     { transform: translateY(3px); }
      51%, 100% { transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .line, .halo, .rays, .dot, .cursor, .hand { animation: none; }
      .ripple { display: none; }
    }
  </style>

  <!-- LAYER 1: full-bleed olive field -->
  <rect width="100%" height="100%" fill="#788C5D"/>

  <!-- LAYER 2: ivory monitor body, the screen carrier -->
  <path d="M 400 90 Q 800 72 1200 88 Q 1218 340 1204 588 Q 800 606 396 590 Q 384 340 400 90 Z" fill="#FAF9F5"/>

  <!-- LAYER 3: ink (static) -->
  <g filter="url(#wobble)" stroke="#141413" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- monitor outline, inner screen edge, chin button -->
    <path stroke-width="11" d="M 400 90 Q 800 72 1200 88 Q 1218 340 1204 588 Q 800 606 396 590 Q 384 340 400 90 Z"/>
    <path stroke-width="8" d="M 444 132 Q 800 120 1158 130 Q 1166 320 1156 526 Q 800 536 446 524 Q 436 330 444 132 Z"/>
    <circle cx="800" cy="563" r="7" fill="#141413" stroke-width="4"/>

    <!-- stand, base, desk -->
    <path stroke-width="10" d="M 745 598 Q 740 650 735 704"/>
    <path stroke-width="10" d="M 855 598 Q 860 650 866 704"/>
    <path stroke-width="10" d="M 646 734 Q 690 706 735 704 L 868 704 Q 912 706 956 734"/>
    <path stroke-width="10" d="M 140 738 Q 800 726 1460 740"/>

    <!-- screen UI: title bar, dots, action card -->
    <path stroke-width="7" d="M 444 190 Q 800 184 1158 188"/>
    <circle cx="484" cy="160" r="8" fill="#141413" stroke-width="3"/>
    <circle cx="516" cy="160" r="8" fill="#141413" stroke-width="3"/>
    <circle cx="548" cy="160" r="8" fill="#141413" stroke-width="3"/>
    <path stroke-width="7" d="M 770 240 Q 900 232 1030 242 Q 1040 340 1030 440 Q 900 448 772 438 Q 760 340 770 240 Z"/>

    <!-- text lines the agent "types" in -->
    <g stroke-width="7">
      <path class="line" pathLength="1" style="--d:0s"   d="M 500 250 L 680 248"/>
      <path class="line" pathLength="1" style="--d:0.3s" d="M 500 296 L 640 295"/>
      <path class="line" pathLength="1" style="--d:0.6s" d="M 500 342 L 700 340"/>
      <path class="line" pathLength="1" style="--d:0.9s" d="M 500 388 L 610 387"/>
    </g>
  </g>

  <!-- glowing action node: rings, rays, core -->
  <g filter="url(#wobble)" stroke="#141413" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle class="halo" cx="900" cy="340" r="64" stroke-width="4"/>
    <circle class="halo halo2" cx="900" cy="340" r="44" stroke-width="6"/>
    <g class="rays" stroke-width="6">
      <path d="M 972 340 L 988 340"/>
      <path d="M 900 412 L 900 428"/>
      <path d="M 849 391 L 838 402"/>
      <path d="M 828 340 L 812 340"/>
      <path d="M 849 289 L 838 278"/>
      <path d="M 900 268 L 900 252"/>
      <path d="M 951 289 L 962 278"/>
    </g>
    <circle class="dot" cx="900" cy="340" r="24" fill="#141413"/>
    <!-- click ripples -->
    <circle class="ripple" cx="900" cy="340" r="40" stroke-width="5"/>
    <circle class="ripple ripple2" cx="900" cy="340" r="40" stroke-width="4"/>
  </g>

  <!-- pointer cursor glides in and clicks -->
  <g filter="url(#wobble)" stroke="#141413" stroke-linecap="round" stroke-linejoin="round">
    <g class="cursor">
      <path stroke-width="10" fill="#FAF9F5" d="M 914 354 L 912 442 L 936 420 L 956 466 L 980 455 L 960 410 L 992 407 Z"/>
    </g>
  </g>

  <!-- human hand resting on the desk, lifts and taps with the click -->
  <g transform="translate(0 16)" filter="url(#wobble)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g class="hand">
      <!-- thumb -->
      <path d="M 1360 772 L 1235 758" stroke="#141413" stroke-width="50"/>
      <path d="M 1360 772 L 1235 758" stroke="#FAF9F5" stroke-width="32"/>
      <!-- fingers, back to front -->
      <path d="M 1340 792 L 1090 800" stroke="#141413" stroke-width="50"/>
      <path d="M 1340 792 L 1090 800" stroke="#FAF9F5" stroke-width="32"/>
      <path d="M 1340 826 L 1062 840" stroke="#141413" stroke-width="50"/>
      <path d="M 1340 826 L 1062 840" stroke="#FAF9F5" stroke-width="32"/>
      <path d="M 1340 860 L 1080 874" stroke="#141413" stroke-width="50"/>
      <path d="M 1340 860 L 1080 874" stroke="#FAF9F5" stroke-width="32"/>
      <path d="M 1340 894 L 1110 906" stroke="#141413" stroke-width="50"/>
      <path d="M 1340 894 L 1110 906" stroke="#FAF9F5" stroke-width="32"/>
      <!-- palm patch hides finger roots, then back-of-hand outline -->
      <path d="M 1340 762 C 1400 752 1500 748 1620 756 L 1620 940 L 1340 940 C 1312 880 1312 810 1340 762 Z" fill="#FAF9F5"/>
      <path d="M 1350 760 C 1420 750 1520 746 1610 756" stroke="#141413" stroke-width="11"/>
      <path d="M 1380 800 C 1400 790 1424 790 1440 798" stroke="#141413" stroke-width="7"/>
    </g>
  </g>
</svg>

