<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1200" height="1200">
  <title>Extended Thinking: The Hybrid Reasoning Engine</title>
  <defs>
    <!-- Analog dip-pen tremor; the seed steps through values so the ink "boils" -->
    <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <feTurbulence type="fractalNoise" baseFrequency="0.016" numOctaves="2" seed="7" result="noise">
        <animate attributeName="seed" values="7;11;3;14;5;9" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <style>
    .halo   { transform-box: fill-box; transform-origin: center; animation: breathe 7s ease-in-out infinite alternate; }
    .head   { animation: bob 6s ease-in-out infinite alternate; }
    .gaze   { animation: travel 1.1s linear infinite; }

    .edge   { stroke-dasharray: 1 1.1; animation: draw 10s ease-in-out infinite backwards; animation-delay: var(--d, 0s); }
    .node   { transform-box: fill-box; transform-origin: center; animation: pop 10s ease-out infinite backwards; animation-delay: var(--d, 0s); }

    .root-ring { transform-box: fill-box; transform-origin: center; animation: ring 3.2s ease-in-out infinite; }
    .root-dot  { transform-box: fill-box; transform-origin: center; animation: throb 3.2s ease-in-out infinite; }
    .spark     { transform-box: fill-box; transform-origin: center; animation: flicker 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }

    @keyframes breathe { from { transform: scale(1) rotate(0deg); } to { transform: scale(1.025) rotate(0.6deg); } }
    @keyframes bob     { from { transform: translateY(0); } to { transform: translateY(-4px); } }
    @keyframes travel  { to { stroke-dashoffset: -18; } }

    @keyframes draw {
      0%   { stroke-dashoffset: 1.1; opacity: 1; }
      20%  { stroke-dashoffset: 0; }
      88%  { stroke-dashoffset: 0; opacity: 1; }
      96%  { stroke-dashoffset: 0; opacity: 0; }
      100% { stroke-dashoffset: 1.1; opacity: 0; }
    }
    @keyframes pop {
      0%, 12% { transform: scale(0); }
      19%     { transform: scale(1.3); }
      25%     { transform: scale(1); }
      88%     { transform: scale(1); }
      96%, 100% { transform: scale(0); }
    }
    @keyframes ring    { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.18); opacity: 0.55; } }
    @keyframes throb   { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.14); } }
    @keyframes flicker { 0%, 100% { transform: scale(0.5); opacity: 0; } 40%, 60% { transform: scale(1); opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .halo, .head, .gaze, .edge, .node, .root-ring, .root-dot, .spark { animation: none; }
    }
  </style>

  <!-- LAYER 1: full-bleed heather field -->
  <rect width="100%" height="100%" fill="#CBCADB"/>

  <!-- LAYER 2: irregular ivory thought halo -->
  <path class="halo" d="M 148 490 C 132 340 245 195 420 178 C 565 160 725 190 815 300 C 895 400 885 600 832 705 C 780 795 640 845 500 838 C 340 832 190 805 150 645 C 136 595 150 540 148 490 Z" fill="#FAF9F5"/>

  <!-- LAYER 3: ink -->
  <g filter="url(#wobble)" stroke="#141413" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <g class="head">
      <!-- profile contour: back of neck, skull, brow, nose, lips, chin, throat -->
      <path stroke-width="10" d="M 250 868 C 264 806 252 758 236 716 C 190 650 184 548 204 468 C 224 372 298 300 388 292 C 450 288 490 316 504 358 C 510 392 520 418 534 446 L 566 524 C 569 540 554 546 540 549 C 546 563 548 573 540 583 C 552 593 548 603 538 609 C 546 623 540 635 520 653 C 505 671 480 680 450 680 C 440 706 446 738 456 772 L 474 868"/>

      <!-- hairline, ear, closed eye -->
      <path stroke-width="8" d="M 226 440 C 258 366 330 330 410 338"/>
      <path stroke-width="8" d="M 346 478 C 312 468 306 530 342 548"/>
      <path stroke-width="8" d="M 484 440 Q 502 428 522 440"/>
    </g>

    <!-- gaze: dots stream from the eye to the root thought -->
    <path class="gaze" stroke-width="9" stroke-dasharray="1 17" d="M 552 456 L 600 468"/>

    <!-- constellation edges, drawn outward from the root -->
    <g stroke-width="7">
      <path class="edge" pathLength="1" style="--d:0s"    d="M 622 474 Q 650 430 684 394"/>
      <path class="edge" pathLength="1" style="--d:0.1s"  d="M 622 476 Q 654 506 692 522"/>
      <path class="edge" pathLength="1" style="--d:1s"    d="M 684 394 Q 708 345 732 302"/>
      <path class="edge" pathLength="1" style="--d:1.15s" d="M 684 394 Q 740 380 790 404"/>
      <path class="edge" pathLength="1" style="--d:1.1s"  d="M 692 522 Q 730 500 772 502"/>
      <path class="edge" pathLength="1" style="--d:1.25s" d="M 692 522 Q 712 560 742 592"/>
      <path class="edge" pathLength="1" style="--d:2.1s"  d="M 790 404 Q 770 450 772 502"/>
      <path class="edge" pathLength="1" style="--d:2s"    d="M 732 302 Q 764 276 800 262"/>
      <path class="edge" pathLength="1" style="--d:2.15s" d="M 732 302 Q 716 270 702 244"/>
      <path class="edge" pathLength="1" style="--d:2.25s" d="M 790 404 Q 814 380 836 352"/>
      <path class="edge" pathLength="1" style="--d:2.1s"  d="M 772 502 Q 806 510 840 522"/>
      <path class="edge" pathLength="1" style="--d:2.3s"  d="M 742 592 Q 778 620 808 650"/>
    </g>

    <!-- spark ticks around the root -->
    <g stroke-width="6">
      <path class="spark" style="--d:0s"   d="M 598 436 L 586 420"/>
      <path class="spark" style="--d:0.8s" d="M 622 428 L 624 408"/>
      <path class="spark" style="--d:1.6s" d="M 646 442 L 660 430"/>
    </g>
  </g>

  <!-- nodes: root with concentric ring, branches, terminals -->
  <g filter="url(#wobble)" stroke="#141413" stroke-linecap="round" stroke-linejoin="round">
    <circle class="root-ring" cx="622" cy="476" r="38" fill="none" stroke-width="6"/>
    <circle class="root-dot" cx="622" cy="476" r="20" fill="#141413"/>

    <circle class="node" style="--d:0s" cx="684" cy="394" r="15" fill="#141413"/>
    <circle class="node" style="--d:0s" cx="684" cy="394" r="26" fill="none" stroke-width="5"/>
    <circle class="node" style="--d:0.1s" cx="692" cy="522" r="15" fill="#141413"/>

    <circle class="node" style="--d:1s"    cx="732" cy="302" r="12" fill="#141413"/>
    <circle class="node" style="--d:1.15s" cx="790" cy="404" r="12" fill="#141413"/>
    <circle class="node" style="--d:1.15s" cx="790" cy="404" r="22" fill="none" stroke-width="5"/>
    <circle class="node" style="--d:1.1s"  cx="772" cy="502" r="12" fill="#141413"/>
    <circle class="node" style="--d:1.25s" cx="742" cy="592" r="12" fill="#141413"/>

    <circle class="node" style="--d:2s"    cx="800" cy="262" r="9" fill="#141413"/>
    <circle class="node" style="--d:2.15s" cx="702" cy="244" r="9" fill="#141413"/>
    <circle class="node" style="--d:2.25s" cx="836" cy="352" r="9" fill="#141413"/>
    <circle class="node" style="--d:2.1s"  cx="840" cy="522" r="9" fill="#141413"/>
    <circle class="node" style="--d:2.3s"  cx="808" cy="650" r="9" fill="#141413"/>
  </g>
</svg>

